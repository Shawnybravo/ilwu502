name: ILWU Telegram Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ilwu-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ILWU boards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save monitor state and history
        run: |
          if [ -z "$(git status --porcelain -- state.json history.json)" ]; then
            echo "No state or history change to commit."
            exit 0
          fi

          cp state.json /tmp/monitor-state.json
          cp history.json /tmp/monitor-history.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/monitor-state.json state.json
          cp /tmp/monitor-history.json history.json

          git add state.json history.json
          git commit -m "Update ILWU monitor state and history"
          git push
